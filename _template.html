<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ================================================================
       GA4 측정 블록 — 수정하지 마세요
       수집: page_view / article_read_complete / link_click / cta_click
       ================================================================ -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VFLVE5CVHM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VFLVE5CVHM');
  </script>
  <script>
  (function () {
    var INTERNAL_HOSTS = ['axplanningteam.github.io', 'daoukiwoom.ai'];
    function isInternal(host) {
      for (var i = 0; i < INTERNAL_HOSTS.length; i++) {
        if (host === INTERNAL_HOSTS[i] || host.indexOf('.' + INTERNAL_HOSTS[i]) >= 0) return true;
      }
      return false;
    }
    var readFired = false;
    function onScroll() {
      var doc = document.documentElement, body = document.body;
      var full = Math.max(doc.scrollHeight, body ? body.scrollHeight : 0);
      var seen = (window.pageYOffset || doc.scrollTop) + window.innerHeight;
      if (full <= 0) return;
      if (!readFired && (seen / full > 0.9 || full <= window.innerHeight + 40)) {
        readFired = true;
        gtag('event', 'article_read_complete', {
          page_title: document.title,
          page_location: location.href
        });
        window.removeEventListener('scroll', onScroll);
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('load', onScroll);

    document.addEventListener('click', function (e) {
      var link = e.target && e.target.closest ? e.target.closest('a') : null;
      if (!link || !link.href) return;
      if (/^(mailto:|tel:|javascript:)/i.test(link.getAttribute('href') || '')) return;
      var external = !isInternal(link.hostname);
      var text = (link.innerText || link.textContent || '').trim().slice(0, 50);
      gtag('event', 'link_click', {
        link_text: text,
        link_url: link.href,
        link_type: external ? 'external' : 'internal',
        page_title: document.title
      });
      var cta = link.getAttribute('data-cta');
      if (cta) {
        gtag('event', 'cta_click', {
          cta_name: cta,
          link_url: link.href,
          page_title: document.title
        });
      }
    }, true);
  })();
  </script>
  <!-- ===================== GA4 측정 블록 끝 ===================== -->

  <!-- ▼ 자료마다 수정 ▼ -->
  <title>자료 제목</title>
  <meta property="og:title" content="자료 제목">
  <meta name="description" content="한두 문장 설명.">
  <!-- ▲ 자료마다 수정 ▲ -->

  <style>
    body { margin:0; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; }
  </style>
</head>
<body>

</body>
</html>
