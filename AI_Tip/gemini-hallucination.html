  <script>
  (function () {
    var INTERNAL_HOSTS = ['axplanningteam.github.io', 'daoukiwoom.ai'];
    function isInternal(host) {
      for (var i = 0; i < INTERNAL_HOSTS.length; i++) {
        if (host === INTERNAL_HOSTS[i] || host.indexOf('.' + INTERNAL_HOSTS[i]) >= 0) return true;
      }
      return false;
    }
    var readFired = false;
    function onScroll() {
      var doc = document.documentElement, body = document.body;
      var full = Math.max(doc.scrollHeight, body ? body.scrollHeight : 0);
      var seen = (window.pageYOffset || doc.scrollTop) + window.innerHeight;
      if (full <= 0) return;
      if (!readFired && (seen / full > 0.9 || full <= window.innerHeight + 40)) {
        readFired = true;
        gtag('event', 'article_read_complete', {
          page_title: document.title,
          page_location: location.href
        });
        window.removeEventListener('scroll', onScroll);
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('load', onScroll);

    document.addEventListener('click', function (e) {
      var link = e.target && e.target.closest ? e.target.closest('a') : null;
      if (!link || !link.href) return;
      if (/^(mailto:|tel:|javascript:)/i.test(link.getAttribute('href') || '')) return;
      var external = !isInternal(link.hostname);
      var text = (link.innerText || link.textContent || '').trim().slice(0, 50);
      gtag('event', 'link_click', {
        link_text: text,
        link_url: link.href,
        link_type: external ? 'external' : 'internal',
        page_title: document.title
      });
      var cta = link.getAttribute('data-cta');
      if (cta) {
        gtag('event', 'cta_click', {
          cta_name: cta,
          link_url: link.href,
          page_title: document.title
        });
      }
    }, true);
  })();
  </script>

  @media print {
    body { background: #fff; }
    .progresswrap, .side-arrow, .inrow, .simtag, .footnote, .top p { display: none !important; }
    .phone { border: none; box-shadow: none; }
    .wrap { padding: 0; max-width: none; }
    .copy-btn { display: none; }
    details.ref, details.fold { border: none; }
    details.fold > *:not(summary) { padding: 0; }
    details.fold summary { padding: 0 0 12px; font-size: 18px; }
    .techgrid, .clgrid { display: block !important; }
    .refgrid { break-inside: avoid; page-break-inside: avoid; }
    .techgrid .sumcard, .clgrid .sumcard { margin-bottom: 16px; }
    .sumcard, .ritem, .copybox, .refcol, .cmpwrap, .kcard, table
      { break-inside: avoid; page-break-inside: avoid; }
    details.fold { break-before: page; page-break-before: always; }
    .sumcard .wm { display: none; }
    .titlerow .mascot { display: none; }
  }
  .techgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .techgrid .sumcard { margin-bottom: 0; display: flex; flex-direction: column; }
  .techgrid .sumgrow { flex: 1; }
  @media (max-width: 860px) { .techgrid { grid-template-columns: 1fr; } }
  details.fold { margin-top: 18px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
  details.fold summary { cursor: pointer; padding: 16px 20px; font-size: 16px; font-weight: 800;
    color: var(--ink); list-style: none; }
  details.fold summary::before { content: "▸ "; color: var(--blue); }
  details.fold[open] summary::before { content: "▾ "; }
  details.fold > *:not(summary) { padding: 0 20px 18px; }
  details.fold .clgrid, details.fold .refgrid { padding: 2px 20px 20px; }

  /* ===== embed(iframe) 전용 보정 — 직접 열었을 때는 적용되지 않음 =====
     iframe 안에서는 position:fixed 가 iframe 전체를 기준으로 잡혀
     화살표가 화면 맨 아래로 밀려나므로, 본문(.wrap) 기준 세로 중앙에 고정한다. */
  .in-embed .wrap { position: relative; }
  .in-embed .side-arrow {
    position: absolute !important;
    top: 50% !important;
    bottom: auto !important;
    transform: translateY(-50%) !important;
    width: 44px !important; height: 44px !important;
  }
  .in-embed .side-arrow.left  { left: 4px !important;  right: auto !important; }
  .in-embed .side-arrow.right { right: 4px !important; left: auto !important; }
  @media (max-width: 700px) {
    .in-embed .side-arrow { width: 38px !important; height: 38px !important; }
    .in-embed .side-arrow.left  { left: 2px !important; }
    .in-embed .side-arrow.right { right: 2px !important; }
  }

let cur = 0, busy = false;
let quizTotal = 0, quizCorrect = 0;
const doneSteps = new Set();
const $ = id => document.getElementById(id);
const esc = t => t.replace(/</g, '&lt;');

function renderSteps() {
  const fill = $('pfill'), lab = $('plab');
  if (!fill) return;
  fill.style.width = ((cur + 1) / STEPS.length * 100) + '%';
  lab.textContent = `${cur + 1} / ${STEPS.length}`;
  const sl = $('sumlink'); if (sl) sl.style.visibility = cur === STEPS.length - 1 ? 'hidden' : 'visible';
}
function go(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  busy = false;
  renderSteps();
  const aL = $('arrL'), aR = $('arrR');
  if (aL) { aL.disabled = cur === 0; aR.disabled = cur === STEPS.length - 1; }
  $('chat').innerHTML = ''; $('extra').innerHTML = ''; $('inrow').innerHTML = ''; $('ctx').innerHTML = '';
  $('chat').style.minHeight = '';
  $('inrow').classList.remove('quizzone');
  STEPS[cur].run();
  window.scrollTo({ top: 0, behavior: 'instant' });
}
function finishStep() { doneSteps.add(cur); renderSteps(); }
function nextBtn(label) {
  const last = cur === STEPS.length - 1;
  return `<button class="actbtn next" onclick="go(${cur + 1})">${label || '다음 단계 →'}</button>`;
}
function addUser(text) {
  const d = document.createElement('div'); d.className = 'msg user'; d.textContent = text;
  $('chat').appendChild(d); scrollBottom();
}
function addCoach(html) {
  const prev = $('chat').lastElementChild;
  const isCont = prev && prev.classList.contains('coachwrap');
  const wrap = document.createElement('div');
  wrap.className = 'coachwrap' + (isCont ? ' cont' : '');
  wrap.innerHTML = (isCont ? '' : `<img class="avatar" src="${COACH_AVATAR}" alt="AX 코치">`) +
    `<div class="coachcol">${isCont ? '' : '<span class="who">AX 코치</span>'}<div class="msg coachmsg">${html}</div></div>`;
  $('chat').appendChild(wrap); scrollBottom();
}
function addFbk(good, html) {
  const d = document.createElement('div'); d.className = 'fbk ' + (good ? 'good' : 'bad');
  d.innerHTML = html; $('chat').appendChild(d); scrollBottom();
}
function scrollBottom() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }
function typeBot(html, cls, done) {
  const t = document.createElement('div'); t.className = 'typing'; t.innerHTML = '<i></i><i></i><i></i>';
  $('chat').appendChild(t); scrollBottom();
  setTimeout(() => {
    t.remove();
    const d = document.createElement('div'); d.className = 'msg bot' + (cls ? ' ' + cls : '');
    $('chat').appendChild(d);
    const tokens = html.split(/(<[^>]+>)/g).filter(Boolean);
    let ti = 0, ci = 0, out = '';
    (function step() {
      if (ti >= tokens.length) { done && done(d); return; }
      const tk = tokens[ti];
      if (tk.startsWith('<')) { out += tk; ti++; }
      else { out += tk[ci++]; if (ci >= tk.length) { ti++; ci = 0; } }
      d.innerHTML = out;
      if (out.length % 60 === 0) scrollBottom();
      setTimeout(step, tk.startsWith('<') ? 0 : 12);
    })();
  }, 800);
}
function copyP(btn) {
  const txt = btn.parentElement.querySelector('code').textContent;
  const done = () => { btn.textContent = '복사됨!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(done, done); }
  else { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
}

     <p class="metaphor">마치 회의 중 기습 질문을 받았을 때, 눈치 빠르게 모르는 질문에도 아는 것처럼 유창하게 대답하는 것과도 같습니다.</p>
     <h3 class="sep">참고 사항 3가지</h3>
     <div class="kcard"><b><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg> 버그가 아닌 본질적 특성</b>생성형 AI의 작동 방식에서 오는 특성이라 완전히 없애기는 어렵습니다.</div>
     <div class="kcard"><b><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg> 하지만 통제할 수 있습니다</b>질문 방법과 검증 습관으로 위험을 크게 줄일 수 있습니다.</div>
     <div class="kcard"><b><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> “검증하며 쓴다”가 정답</b>검증 비용을 감안해도 초안 작성·요약·아이디어 발산에서 Gemini가 압도적으로 빠릅니다.</div>`;
  $('chat').appendChild(lesson);
  $('inrow').innerHTML =
    `<p class="hint">확인 퀴즈 — “Gemini의 답변이 자연스럽고 유창하면 사실일 가능성이 높다.”</p>
     <div class="optrow">
       <button class="optbtn" onclick="conceptAnswer(this,false)">O 맞다</button>
       <button class="optbtn" onclick="conceptAnswer(this,true)">X 아니다</button>
     </div>`;
}
function conceptAnswer(btn, correct) {
  if (busy) return; busy = true;
  quizTotal++; if (correct) quizCorrect++;
  addUser(btn.textContent);
  addFbk(correct, (correct ? '<b>정답!</b> ' : '<b>아쉬워요.</b> ') + '문장의 자연스러움과 사실 여부는 무관합니다. Gemini는 그럴듯한 다음 말을 예측할 뿐입니다.');
  finishStep(); busy = false;
  $('inrow').innerHTML = `<p class="hint">이제 어떤 작업이 위험한지 직접 분류해 봅니다.</p>` + nextBtn('2단계 · 위험도 분류 →');
}

/* ───────────────────────── scene: sort quiz ───────────────────────── */
let sortIdx = 0, sortCorrect = 0;
function sceneSort() {
  sortIdx = 0; sortCorrect = 0;
  addCoach('<b>“내가 검증할 수 없는 답은, 업무에 쓰면 안 되는 답”</b>입니다.<br>지금부터 6가지 작업을 드릴 테니, 안심 작업인지 검증이 필요한 작업인지 골라보세요.');
  sortAsk();
}
function sortAsk() {
  const s = SORTS[sortIdx];
  addCoach(`<span class="nowrap">Q${sortIdx + 1}. <b>${s.q}</b> — 안심일까요, 검증 필요일까요?</span>`);
  $('inrow').innerHTML =
    `<p class="hint">${sortIdx + 1} / ${SORTS.length}</p>
     <div class="optrow">
       <button class="optbtn safe" onclick="sortAnswer(true)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> 안심</button>
       <button class="optbtn risk" onclick="sortAnswer(false)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 검증 필요</button>
     </div>`;
}
function sortAnswer(pickedSafe) {
  if (busy) return; busy = true;
  const s = SORTS[sortIdx];
  const correct = pickedSafe === s.safe;
  quizTotal++; if (correct) { quizCorrect++; sortCorrect++; }
  addUser(pickedSafe ? '안심' : '검증 필요');
  addFbk(correct, (correct ? '<b>정답!</b> ' : '<b>아쉬워요.</b> ') + s.fb);
  sortIdx++; busy = false;
  if (sortIdx < SORTS.length) { setTimeout(sortAsk, 350); return; }
  addCoach(`분류 퀴즈 결과: <b>${SORTS.length}문제 중 ${sortCorrect}개 정답!</b> 실무에서 참고할 전체 기준표를 아래에 정리해 두었어요.`);
  renderRefTable();
  finishStep();
  $('inrow').innerHTML = `<p class="hint">이제 할루시네이션을 줄이는 4가지 기법을 직접 체험합니다.</p>` + nextBtn('기법 ① 체험하기 →');
}
function renderRefTable() {
  const safe = REF_SAFE.map(x => `<div class="ritem"><b>${x[0]}</b>${x[1]}</div>`).join('');
  const risk = REF_RISK.map(x => `<div class="ritem"><b>${x[0]}</b>${x[1]}<br><span class="how">→ ${x[2]}</span></div>`).join('');
  $('extra').innerHTML =
    `<details class="ref" open><summary>전체 위험도 기준표 — 실무에서 참고할 10가지 작업 유형</summary>
      <div class="refgrid">
        <div class="refcol safe"><h4><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> 안심하고 써도 되는 작업 (위험 낮음)</h4>${safe}</div>
        <div class="refcol risk"><h4><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 반드시 검증해야 하는 작업 (위험 높음)</h4>${risk}</div>
      </div></details>`;
}

/* ───────────────────────── scene: simulation ───────────────────────── */
function sceneSim(key) {
  const s = SIMS[key];
  const idx = ['t1','t2','t3','t4'].indexOf(key);
  $('ctx').innerHTML = s.ctx;
  const TITLES = {
    t1: '기억에 묻지 말고, 문서를 ‘근거’로 주기',
    t2: '“문서 안에서만 답해” 프롬프트 패턴',
    t3: '“단계별로 진행해줘” — 한 번에 다 시키지 않기',
    t4: '최신 정보는 ‘Gemini 앱’에서 ‘Google 검색 연동’으로'
  };
  addCoach(`<b class="nowrap">기법 ${'①②③④'[idx]}. ${TITLES[key]}</b>`);
  addCoach('<span class="nowrap">무엇이 잘못될지, 아래 프롬프트를 직접 보내서 확인해 보세요.</span>');
  if (s.doc) {
    const dc = document.createElement('div');
    dc.className = 'doccard';
    dc.innerHTML = `<div class="dochead">${s.doc.icon}<b>${s.doc.name}</b><span class="doctag">첨부된 문서</span></div><p>${s.doc.desc}</p>`;
    $('chat').appendChild(dc);
  }
  $('inrow').innerHTML =
    `<p class="hint">흔히 이렇게 묻게 됩니다 — 눌러서 전송</p>
     <button class="sendchip" onclick="simBad('${key}')"><span>${esc(s.badQ)}</span><span class="send"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></span></button>`;
}
function simBad(key) {
  if (busy) return; busy = true;
  const s = SIMS[key];
  $('inrow').innerHTML = '<p class="hint">Gemini가 답변 중…</p>';
  addUser(s.badQ);
  typeBot(s.badA, 'badmsg', () => {
    busy = false;
    $('inrow').innerHTML =
      `<p class="hint">답변이 꽤 그럴 듯 하죠?</p>
       <button class="actbtn reveal" onclick="simReveal('${key}')"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> 어디가 지어낸 부분일까? — 정답 확인</button>`;
  });
}
function simReveal(key) {
  const s = SIMS[key];
  document.querySelectorAll('.badmsg').forEach(m => m.classList.add('revealed'));
  const v = document.createElement('div'); v.className = 'verdict'; v.innerHTML = s.verdict;
  $('chat').appendChild(v);
  const c = document.createElement('div'); c.className = 'coach'; c.innerHTML = s.coach;
  $('extra').appendChild(c); scrollBottom();
  $('inrow').innerHTML =
    `<p class="hint">이번엔 안전장치를 넣은 프롬프트로 다시 물어봅니다.</p>
     <button class="sendchip" onclick="simGood('${key}')"><span>${esc(s.goodQ)}</span><span class="send"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></span></button>`;
}
function simGood(key) {
  if (busy) return; busy = true;
  const s = SIMS[key];
  $('ctx').innerHTML = s.goodCtx;
  $('inrow').innerHTML = '<p class="hint">Gemini가 답변 중…</p>';
  addUser(s.goodQ);
  if (s.goodDoc) {
    const dc = document.createElement('div');
    dc.className = 'doccard mine';
    dc.innerHTML = `<div class="dochead">${s.goodDoc.icon}<b>${s.goodDoc.name}</b><span class="doctag">${s.goodDoc.tag || '첨부된 문서'}</span></div><p>${s.goodDoc.desc}</p>`;
    $('chat').appendChild(dc); scrollBottom();
  }
  const srcHtml = s.goodSrc.map(x => `<span class="src">${x}</span>`).join('');
  typeBot(s.goodA, '', d => {
    d.innerHTML += '\n' + srcHtml;
    busy = false;
    const box = document.createElement('div'); box.className = 'coach practice';
    box.innerHTML = `<b><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg> ${s.copyLabel}</b><div class="copybox"><code>${esc(s.copy)}</code><button class="copy-btn" onclick="copyP(this)">복사</button></div>`;
    $('extra').appendChild(box);
    finishStep(); scrollBottom();
    const labels = { t1: '기법 ② 체험하기 →', t2: '기법 ③ 체험하기 →', t3: '기법 ④ 체험하기 →', t4: '마지막 · 검증 체크리스트 →' };
    $('inrow').innerHTML =
      `<p class="hint">초록 = 근거 확인된 내용 · ‘없음’을 없다고 말하게 하는 것이 핵심</p>` + nextBtn(labels[key]);
  });
}

/* ───────────────────────── scene: checklist + finish ───────────────────────── */
function sceneChecklist() {
  $('chat').style.minHeight = '0';
  const t = document.createElement('div');
  t.className = 'lesson';
  t.innerHTML = `<div class="titlerow" style="margin-bottom:4px"><img class="mascot" src="${BEAR_IMG}" alt=""><h2>마지막으로: 답변 전후로 이 검증 체크리스트를 확인해보세요.</h2></div>`;
  $('chat').appendChild(t);
  const pre = CHECK_PRE.map((x, i) => `<label class="cl"><input type="checkbox" onchange="clCheck()"><span><b>${i + 1}.</b> ${x}</span></label>`).join('');
  const post = CHECK_POST.map((x, i) => `<label class="cl"><input type="checkbox" onchange="clCheck()"><span><b>${i + 1}.</b> ${x}</span></label>`).join('');
  $('extra').innerHTML =
    `<div style="padding:0 24px 10px">
       <p class="clhead pre"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> 질문하기 전 3가지</p>${pre}
       <p class="clhead post"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> 답변 받은 후 3가지</p>${post}
     </div>`;
  $('inrow').innerHTML = `<p class="hint" id="clHint">체크리스트를 모두 확인해야 완료할 수 있어요. (0 / 6)</p><button class="actbtn go" id="clDone" onclick="finish()" disabled>완료하기 →</button>`;
}
function clCheck() {
  const n = document.querySelectorAll('.cl input:checked').length;
  const h = $('clHint'); if (h) h.textContent = n < 6 ? `체크리스트를 모두 확인해야 완료할 수 있어요. (${n} / 6)` : '모두 확인했어요! 완료해 주세요. (6 / 6)';
  const btn = $('clDone'); if (btn) btn.disabled = n < 6;
}
function finish() {
  finishStep();
  $('chat').innerHTML = ''; $('extra').innerHTML = '';
  const scoreLine = quizTotal === 0 ? '퀴즈는 건너뛰셨네요. 언제든 다시 풀어보세요!' : `퀴즈 결과: ${quizTotal}문제 중 ${quizCorrect}개 정답!`;
  $('chat').innerHTML =
    `<div class="finish">
       <div class="big"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><polyline points="20 6 9 17 4 12"/></svg></div>
       <h3>튜토리얼 완료!</h3>
       <div class="oneline"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> 한 줄 요약 — “초안은 AI가, 최종 검증은 내가.”</div>
       <ul class="sumlist">
         <li><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> 문서를 근거로 주고, 범위를 못 박고</li>
         <li><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg> 복잡한 작업은 단계별로 진행하고</li>
         <li><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> 최신 정보는 Gemini 앱에서 Google 검색 연동과 함께</li>
       </ul>
       <p class="score">${scoreLine}</p>
     </div>`;
  $('inrow').innerHTML =
    `<button class="actbtn go" onclick="go(STEPS.length - 1)">전체 요약 · 프롬프트 모음 보기 →</button>
     <div style="height:10px"></div>
     <button class="actbtn ghost" onclick="restart()">처음부터 다시 보기</button>`;
}
function restart() {
  quizTotal = 0; quizCorrect = 0; doneSteps.clear();
  go(0);
}

let _foldState = null;
window.addEventListener('beforeprint', () => {
  const ds = [...document.querySelectorAll('details')];
  _foldState = ds.map(d => d.open);
  ds.forEach(d => d.open = true);
});
window.addEventListener('afterprint', () => {
  if (!_foldState) return;
  [...document.querySelectorAll('details')].forEach((d, i) => { if (_foldState[i] !== undefined) d.open = _foldState[i]; });
  _foldState = null;
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go(cur - 1);
  if (e.key === 'ArrowRight') go(cur + 1);
});
renderSteps(); go(0);
</script>
</body>
</html>
