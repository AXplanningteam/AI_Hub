<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다우키움 AI 허브 위젯</title>
<style>
  :root {
    --navy-1: #0A1628;
    --navy-2: #14304F;
    --sky: #4FC3E8;
    --white: #FFFFFF;
    --ink: #222222;
    --red: #E53935;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
  }

  .hub-widget {
    position: relative;
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    background:
      radial-gradient(120% 100% at 50% 85%, rgba(79, 195, 232, 0.16) 0%, rgba(79, 195, 232, 0) 60%),
      linear-gradient(160deg, var(--navy-2) 0%, var(--navy-1) 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 38px 24px 34px;
  }

  /* ── 배경 장식 ── */
  .deco { position: absolute; pointer-events: none; z-index: 0; }
  /* 캐릭터 구역 안 장식은 소식 패널·캐릭터보다 뒤로 */
  .hub-stage .deco { z-index: -1; }
  /* 캐릭터 양옆 (hub-stage 기준) */
  .deco-arrow {
    left: -6px;
    top: 6%;                /* 캐릭터 머리 높이 근처로 */
    transform: rotate(-10deg);
    width: 58px;
    opacity: 0.65;
  }
  .deco-gyro {
    right: -16px;
    bottom: -42px;          /* 캐릭터 아래, 소식 패널 뒤로 살짝 겹치게 */
    transform: rotate(14deg);
    width: 84px;
    opacity: 0.6;
  }
  /* 상단 문구 근처 우측 (위젯 기준) */
  .deco-node {
    top: 10px;
    right: 8px;
    width: 44px;
    opacity: 0.45;
    transform: rotate(-6deg);
  }

  /* 캐릭터 구역: 양옆 장식의 기준 */
  .hub-stage {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .hub-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* 슬로건 */
  .hub-slogan {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.75;
    color: var(--white);
    letter-spacing: -0.02em;
    word-break: keep-all;
  }
  .hub-slogan .accent { color: var(--sky); }

  /* 캐릭터 */
  .hub-char {
    width: 132px;
    height: auto;
    margin: 22px 0 20px;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
  }

  /* ── 최신 소식 패널 ── */
  .hub-news {
    width: 100%;
    background: var(--white);
    border-radius: 10px;
    padding: 6px 14px;
    margin-bottom: 20px;
    text-align: left;
  }
  .news-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 2px;
    text-decoration: none;
    min-width: 0;
  }
  .news-item + .news-item { border-top: 1px solid #F0F2F4; }
  /* 마우스오버 즉시 뜨는 풀 제목 툴팁 */
  .news-item { position: relative; }
  .news-item:hover::after {
    content: attr(data-title);
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: calc(100% + 6px);
    z-index: 5;
    background: rgba(23, 40, 44, 0.96);
    color: #FFFFFF;
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1.5;
    padding: 8px 11px;
    border-radius: 8px;
    white-space: normal;
    word-break: keep-all;
    pointer-events: none;
  }
  .news-badge {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #FFFFFF;
    background: var(--red);
    border-radius: 50%;
    line-height: 1;
  }
  .news-title {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    overflow: hidden;
    white-space: nowrap;
  }
  .news-title-inner {
    display: inline-flex;
    gap: 18px;              /* 반복되는 제목 사이 간격 */
    white-space: nowrap;
  }
  .news-title-inner.roll {
    animation: tickerRoll var(--dur, 10s) linear infinite;
    animation-delay: 5s;   /* 위젯 로딩 후 5초 뒤 롤링 시작 */
  }
  /* 마우스를 올리면 롤링 일시정지 (툴팁 읽는 동안) */
  .news-item:hover .news-title-inner.roll {
    animation-play-state: paused;
  }
  /* 한 바퀴 완료 후 쉬는 동안 일시정지 */
  .news-title-inner.pause-loop {
    animation-play-state: paused;
  }
  /* 캐러셀(뉴스 티커): 왼쪽으로 끊김 없이 무한 순환 */
  @keyframes tickerRoll {
    from { transform: translateX(0); }
    to   { transform: translateX(var(--dist, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .news-title-inner.roll { animation: none; }
  }
  .news-item:hover .news-title { color: #0089A0; }
  .news-empty {
    padding: 14px 2px;
    font-size: 12.5px;
    color: #999999;
    text-align: center;
  }

  /* 바로가기 버튼 */
  .hub-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 210px;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 700;
    color: var(--navy-1);
    background: var(--sky);
    text-decoration: none;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .hub-cta:hover { background: #6ED3F2; }
  .hub-cta:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .hub-cta { transition: none; }
  }
</style>
</head>
<body>

<div class="hub-widget">

  <!-- 좌측 중단: 점선 원 + 상승 화살표 -->

  <!-- 우측 하단: 자이로 궤도 -->

  <!-- 좌측 하단: 노드 네트워크 -->
  <svg class="deco deco-node" viewBox="0 0 90 90" aria-hidden="true">
    <defs>
      <filter id="g2" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g stroke="#7FB8E8" stroke-width="1.2" fill="none" opacity="0.75">
      <path d="M24 26 L58 18 L70 44 L45 45 L24 26 M24 62 L45 45 M70 44 L70 70 M24 26 L24 62"/>
    </g>
    <g filter="url(#g2)"><circle cx="45" cy="45" r="5.2" fill="#3B82F6"/></g>
    <circle cx="24" cy="26" r="3.4" fill="#E6F2FA"/>
    <circle cx="58" cy="18" r="3.4" fill="#E6F2FA"/>
    <circle cx="70" cy="44" r="3.4" fill="#E6F2FA"/>
    <circle cx="24" cy="62" r="3.4" fill="#E6F2FA"/>
    <circle cx="70" cy="70" r="2.8" fill="#E6F2FA"/>
  </svg>

  <div class="hub-inner">
    <p class="hub-slogan">
      다우키움그룹의 <span class="accent">AI 경험</span>과<br>
      <span class="accent">지식 자산</span>을 한 곳에서 만나보세요
    </p>

    <div class="hub-stage">
  <svg class="deco deco-arrow" viewBox="0 0 90 90" aria-hidden="true">
    <defs>
      <filter id="g1" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <circle cx="45" cy="45" r="30" fill="none" stroke="#7FB8E8" stroke-width="1.1" stroke-dasharray="3 4" opacity="0.7"/>
    <g filter="url(#g1)">
      <path d="M45 60 V28" stroke="#4A9FFF" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M36 37 L45 26 L54 37" stroke="#4A9FFF" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="45" cy="61" r="5.4" fill="#3B82F6"/>
    </g>
    <circle cx="70" cy="24" r="2.2" fill="#BFDFF6" opacity="0.85"/>
  </svg>
      <img class="hub-char" alt="다우키움 AI 캐릭터" src="https://axplanningteam.github.io/AI_Hub/ai-hub-character.png">
  <svg class="deco deco-gyro" viewBox="0 0 90 90" aria-hidden="true">
    <defs>
      <filter id="g3" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g stroke="#7FB8E8" stroke-width="1.1" fill="none" opacity="0.75">
      <ellipse cx="45" cy="45" rx="34" ry="12" transform="rotate(-22 45 45)"/>
      <ellipse cx="45" cy="45" rx="34" ry="12" transform="rotate(42 45 45)"/>
      <ellipse cx="45" cy="45" rx="34" ry="12" transform="rotate(106 45 45)"/>
    </g>
    <g filter="url(#g3)">
      <path d="M31 49 L58 41" stroke="#4A9FFF" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="60" cy="40" r="4" fill="#3B82F6"/>
    </g>
  </svg>
    </div>

    <!-- 최신 소식 (JSON에서 자동 로드) -->
    <div class="hub-news" id="hubNews">
      <p class="news-empty">최신 소식을 불러오는 중...</p>
    </div>

    <a class="hub-cta" href="https://daoukiwoom.ai/?utm_source=daou_portal&utm_medium=widget&utm_campaign=ai_hub_shortcut" target="_blank" rel="noopener">AI 허브 바로가기</a>
  </div>

</div>

<script>
(function () {
  /* ─────────── 설정 ─────────── */
  var NEWS_JSON_URL = "https://axplanningteam.github.io/AI_Hub/hub-news.json";
  // 위젯에서 숨길 카테고리
  var EXCLUDE_CATEGORIES = ["아카데미", "AI 아카데미"];
  // 표시할 최대 개수
  var MAX_ITEMS = 5;
  // 등록 후 NEW 배지를 붙일 기간(일)
  var NEW_BADGE_DAYS = 7;
  /* ──────────────────────────── */

  var box = document.getElementById("hubNews");

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  // 데이터에 남아 있을 수 있는 HTML 엔티티(&#x27; 등)를 일반 문자로 복원
  function unescapeEntities(s) {
    if (!s || s.indexOf("&") === -1) return s;
    var d = document.createElement("textarea");
    d.innerHTML = s;
    return d.value;
  }

  function render(items) {
    if (!items.length) {
      box.innerHTML = '<p class="news-empty">등록된 소식이 없습니다.</p>';
      return;
    }
    var now = Date.now();
    box.innerHTML = items.map(function (it) {
      var isNew = it.date && (now - new Date(it.date).getTime()) < NEW_BADGE_DAYS * 86400000;
      var fullTitle = esc(unescapeEntities(it.title || ""));
      return '<a class="news-item" href="' + esc(it.url || "#") + '" data-title="' + fullTitle + '" target="_blank" rel="noopener">'
        + (isNew ? '<span class="news-badge">N</span>' : "")
        + '<span class="news-title"><span class="news-title-inner"><span>' + esc(unescapeEntities(it.title || "")) + "</span></span></span>"
        + "</a>";
    }).join("");
    startRolling();
  }

  // 영역보다 긴 제목만 캐러셀(티커) 롤링
  var TICKER_GAP = 18;      // CSS의 gap과 동일하게
  var TICKER_SPEED = 24;    // px/초
  var LOOP_REST_MS = 10000; // 한 바퀴 후 쉬는 시간(ms)

  function startRolling() {
    requestAnimationFrame(function () {
      var titles = box.querySelectorAll(".news-title");
      for (var i = 0; i < titles.length; i++) {
        var outer = titles[i];
        var inner = outer.querySelector(".news-title-inner");
        var textEl = inner.firstChild;
        if (!textEl) continue;
        var textW = textEl.scrollWidth || textEl.offsetWidth;
        if (textW <= outer.clientWidth + 4) continue; // 안 넘치면 그대로

        // 같은 제목을 하나 더 이어붙여서 끊김 없는 순환 구조로
        var clone = textEl.cloneNode(true);
        clone.setAttribute("aria-hidden", "true");
        inner.appendChild(clone);

        var loopW = textW + TICKER_GAP; // 정확히 한 벌 길이만큼 이동하면 처음과 동일한 화면
        inner.style.setProperty("--dist", -loopW + "px");
        inner.style.setProperty("--dur", (loopW / TICKER_SPEED) + "s");
        inner.classList.add("roll");

        // 한 바퀴 끝날 때마다 10초 쉬었다가 다시 롤링
        inner.addEventListener("animationiteration", function (e) {
          var el = e.target;
          el.classList.add("pause-loop");
          setTimeout(function () { el.classList.remove("pause-loop"); }, LOOP_REST_MS);
        });
      }
    });
  }

  fetch(NEWS_JSON_URL, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var items = Array.isArray(data) ? data : (data.items || []);
      items = items
        .filter(function (it) { return EXCLUDE_CATEGORIES.indexOf(it.category) === -1; })
        .sort(function (a, b) { return new Date(b.date || 0) - new Date(a.date || 0); })
        .slice(0, MAX_ITEMS);
      render(items);
    })
    .catch(function () {
      box.innerHTML = '<p class="news-empty">소식을 불러오지 못했습니다.</p>';
    });
})();
</script>

</body>
</html>
