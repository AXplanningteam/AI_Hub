name: Update hub news

on:
  schedule:
    # 매일 오전 9시(KST) = 0시(UTC)에 실행
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 자료 폴더의 커밋 날짜를 읽기 위해 전체 히스토리 필요

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update hub-news.json
        run: python update_news.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hub-news.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update hub news ($(date +'%Y-%m-%d'))"
            git push
          fi
