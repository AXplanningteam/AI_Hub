name: Update hub news

on:
  schedule:
    # 30분마다 실행 (실제로는 GitHub 사정에 따라 몇 분 지연될 수 있음)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼 활성화

permissions:
  contents: write

# 동시 실행 방지 (수동 실행과 스케줄 실행이 겹쳐도 충돌하지 않게)
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 자료 폴더의 커밋 날짜를 읽기 위해 전체 히스토리 필요

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inject GA4 into tip HTML
        run: python inject_ga4.py

      - name: Update hub-news.json
        run: python update_news.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update hub news ($(date +'%Y-%m-%d'))"
            # 실행 중 리포에 새 커밋이 들어왔어도 충돌 없이 푸시되도록
            git pull --rebase origin main
            git push
          fi
